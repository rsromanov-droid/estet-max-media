name: Normalize editorial images
on:
  push:
    branches: [main]
    paths: ['originals/*.png', '.github/workflows/editorial-images.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: max-media-render
  cancel-in-progress: false
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 -m pip install Pillow==11.3.0
      - name: Fit complete artwork without cropping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          from PIL import Image, ImageOps
          Path('posts').mkdir(exist_ok=True)
          for source in sorted(Path('originals').glob('*.png')):
              data = source.read_bytes()
              output = Path('posts') / (source.stem + '-1080x1350.png')
              manifest = output.with_suffix('.manifest.json')
              fingerprint = hashlib.sha256(data).hexdigest()
              if output.exists():
                  assert manifest.exists() and json.loads(manifest.read_text())['source_sha256'] == fingerprint
                  continue
              image = Image.open(source).convert('RGB')
              final = ImageOps.pad(image, (1080,1350), method=Image.Resampling.LANCZOS, color='#102d2c')
              final.save(output, optimize=True)
              assert Image.open(output).size == (1080,1350)
              manifest.write_text(json.dumps({'source_sha256':fingerprint,'image_sha256':hashlib.sha256(output.read_bytes()).hexdigest(),'width':1080,'height':1350,'method':'fit_complete_original_no_crop'},indent=2))
          PY
      - name: Save versioned artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add posts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Normalize reviewed editorial artwork to 1080x1350'
          git push origin HEAD:main
