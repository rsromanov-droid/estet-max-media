<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07120f"/>
    <stop offset=".48" stop-color="#0b2b25"/>
    <stop offset="1" stop-color="#16130f"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#172e2b" stop-opacity=".92"/>
    <stop offset="1" stop-color="#081310" stop-opacity=".98"/>
  </linearGradient>
  <linearGradient id="sun" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#f0c078" stop-opacity="0"/>
    <stop offset=".62" stop-color="#f0b566" stop-opacity=".35"/>
    <stop offset="1" stop-color="#f6c681" stop-opacity=".72"/>
  </linearGradient>
  <radialGradient id="glow" cx="80%" cy="38%" r="46%">
    <stop offset="0" stop-color="#f2b96e" stop-opacity=".45"/>
    <stop offset="1" stop-color="#f2b96e" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".38"/></filter>
</defs>

<rect width="1080" height="1350" fill="url(#bg)"/>
<circle cx="880" cy="410" r="360" fill="url(#glow)"/>

<!-- panoramic window -->
<rect x="472" y="0" width="608" height="922" fill="#101b1c"/>
<rect x="496" y="24" width="560" height="850" rx="6" fill="url(#glass)" stroke="#6f5a3b" stroke-opacity=".35"/>
<rect x="496" y="520" width="560" height="354" fill="url(#sun)"/>

<!-- skyline -->
<g fill="#111c1d" stroke="#9f7647" stroke-opacity=".25">
  <rect x="540" y="536" width="55" height="338"/>
  <rect x="606" y="478" width="62" height="396"/>
  <rect x="682" y="566" width="49" height="308"/>
  <rect x="744" y="430" width="70" height="444"/>
  <rect x="826" y="515" width="50" height="359"/>
  <rect x="888" y="460" width="70" height="414"/>
  <rect x="972" y="590" width="54" height="284"/>
</g>
<g fill="#d9ae6c" opacity=".8">
  <circle cx="560" cy="612" r="4"/><circle cx="560" cy="648" r="4"/><circle cx="560" cy="690" r="4"/>
  <circle cx="630" cy="552" r="4"/><circle cx="630" cy="592" r="4"/><circle cx="630" cy="636" r="4"/>
  <circle cx="770" cy="504" r="4"/><circle cx="770" cy="550" r="4"/><circle cx="770" cy="598" r="4"/>
  <circle cx="914" cy="534" r="4"/><circle cx="914" cy="578" r="4"/><circle cx="914" cy="622" r="4"/>
</g>

<!-- warm sun -->
<circle cx="941" cy="625" r="38" fill="#f2bd70" opacity=".95"/>
<circle cx="941" cy="625" r="88" fill="#f2bd70" opacity=".12" filter="url(#blur)"/>

<!-- premium interior -->
<rect x="0" y="925" width="1080" height="425" fill="#0a100f"/>
<path d="M0 1052 C190 1005 372 1017 520 1062 C697 1115 865 1094 1080 1028 L1080 1350 L0 1350 Z" fill="#121916"/>
<rect x="520" y="1034" width="420" height="178" rx="14" fill="#171a17" stroke="#927248" stroke-opacity=".35" filter="url(#shadow)"/>
<ellipse cx="723" cy="1050" rx="210" ry="54" fill="#25221e"/>
<rect x="590" y="1004" width="292" height="12" rx="6" fill="#b38a52" opacity=".6"/>

<!-- abstract seated silhouette -->
<g transform="translate(710 770)">
  <circle cx="95" cy="62" r="46" fill="#17140f"/>
  <path d="M58 108 C105 82 165 102 188 150 C208 191 210 244 180 297 L84 297 C56 252 39 211 38 169 C36 139 41 121 58 108Z" fill="#26211a"/>
  <path d="M85 94 C100 70 120 65 146 72" stroke="#b88b55" stroke-width="6" stroke-linecap="round" opacity=".6"/>
</g>

<!-- left content panel -->
<rect x="54" y="64" width="482" height="780" rx="28" fill="#071410" fill-opacity=".82" stroke="#c59a5e" stroke-opacity=".25"/>
<text x="92" y="132" font-family="Arial,Helvetica,sans-serif" font-size="24" letter-spacing="4" fill="#d0b27b">НЕДВИЖИМОСТЬ • РОСТОВ</text>

<text x="90" y="286" font-family="Georgia,'Times New Roman',serif" font-size="82" font-weight="700" fill="#f6f1e7">
  <tspan x="90" dy="0">КВАРТИРА</tspan>
  <tspan x="90" dy="94">ПОД ВАШ</tspan>
  <tspan x="90" dy="94" fill="#e5b56f">БЮДЖЕТ</tspan>
</text>

<line x1="90" y1="527" x2="488" y2="527" stroke="#c59a5e" stroke-opacity=".55"/>

<g font-family="Arial,Helvetica,sans-serif">
  <circle cx="112" cy="603" r="24" fill="none" stroke="#d7ad70" stroke-width="2"/>
  <text x="104" y="612" font-size="26" fill="#d7ad70">₽</text>
  <text x="158" y="596" font-size="27" fill="#eee7db">БЮДЖЕТ</text>
  <text x="158" y="629" font-size="21" fill="#9ea9a4">что реально доступно</text>

  <circle cx="112" cy="690" r="24" fill="none" stroke="#d7ad70" stroke-width="2"/>
  <text x="101" y="698" font-size="24" fill="#d7ad70">%</text>
  <text x="158" y="682" font-size="27" fill="#eee7db">ПЛАТЁЖ</text>
  <text x="158" y="715" font-size="21" fill="#9ea9a4">без перегруза по ипотеке</text>

  <circle cx="112" cy="777" r="24" fill="none" stroke="#d7ad70" stroke-width="2"/>
  <text x="102" y="786" font-size="22" fill="#d7ad70">⌂</text>
  <text x="158" y="770" font-size="27" fill="#eee7db">ВАРИАНТЫ</text>
  <text x="158" y="803" font-size="21" fill="#9ea9a4">новостройки и вторичка</text>
</g>

<!-- CTA -->
<rect x="92" y="892" width="896" height="142" rx="34" fill="#d5ae72"/>
<text x="140" y="953" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#102019">ХОТИТЕ ПЕРСОНАЛЬНУЮ ПОДБОРКУ?</text>
<text x="140" y="1004" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="700" fill="#102019">НАЖМИТЕ «ПОДБОР»</text>
<text x="920" y="984" font-family="Arial,Helvetica,sans-serif" font-size="46" fill="#102019">→</text>

<!-- subtle footer -->
<text x="92" y="1274" font-family="Arial,Helvetica,sans-serif" font-size="22" letter-spacing="1.4" fill="#75867f">СЧИТАЕМ СЦЕНАРИЙ ПО ЦИФРАМ, А НЕ ПО ОБЕЩАНИЯМ</text>
</svg>